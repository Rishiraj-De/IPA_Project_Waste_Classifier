# YOLOv8 Waste Dataset Configuration
# Standardized 9-class AI Smart Waste Classification & Segregation System

path: ./ml/dataset/data  # dataset root dir
train: images/train    # train images (relative to 'path')
val: images/val        # val images (relative to 'path')
test: images/test      # optional test images (relative to 'path')

# Classes
nc: 9
names:
  0: Plastic
  1: Paper
  2: Cardboard
  3: Glass
  4: Metal
  5: Organic
  6: E-Waste
  7: Hazardous Waste
  8: Other/Unknown
